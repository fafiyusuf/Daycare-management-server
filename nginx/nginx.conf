user  nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 10240;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens off;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript application/x-javascript text/javascript image/svg+xml;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream backend_app { server backend:8000; }
  upstream frontend_app { server frontend:3000; }

  server {
    listen 80;
    # Uncomment and configure for HTTPS
    # listen 443 ssl http2;
    # ssl_certificate /certs/cert.pem;
    # ssl_certificate_key /certs/key.pem;

    server_name _;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https: http:; connect-src * ws: wss:;" always;

    # Health check
    location = /nginx-health { access_log off; return 200 'ok'; }

    # Media & Static (served directly)
    location /media/ {
      alias /vol/media/;
      access_log off;
      expires 30d;
    }
    location /static/ {
      alias /vol/static/;
      access_log off;
      expires 30d;
    }

    # WebSocket (Channels)
    location /ws/ {
      proxy_pass http://backend_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 60s;
    }

    # API
    location /api/ {
      proxy_pass http://backend_app/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Default to frontend
    location / {
      proxy_pass http://frontend_app;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
